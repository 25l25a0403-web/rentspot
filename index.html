<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Rentspot — Find, Rent, Live Better. Find homes, offices and shops with ease.">
<title>Rentspot | Find • Rent • Live Better</title>
<style>
:root{--navy:#08285b;--yellow:#ffd21c;--yellow2:#f6bd00;--muted:#667895}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--navy);background:#fff}
body{display:flex;justify-content:center}.page{width:100%;max-width:520px;min-height:100svh;background:#fff;overflow:hidden;position:relative;padding-bottom:26px}
.hero{height:52svh;min-height:360px;max-height:610px;position:relative;background-image:url('assets/rentspot-hero.jpg');background-size:cover;background-position:center 46%;isolation:isolate}
.hero:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 98%);z-index:1}
.brand{position:relative;margin:-2px auto 0;width:min(91%,440px);z-index:2;text-align:center}
.brand img{display:block;width:100%;height:auto;margin:auto;object-fit:contain}
.content{text-align:center;padding:5px 25px 0}
h1{font-size:clamp(25px,6.2vw,34px);line-height:1.16;letter-spacing:-.8px;margin:9px 0 7px;font-weight:850}
.subtitle{font-size:clamp(15px,3.9vw,19px);font-weight:600;color:#71809a;margin:0}
.categories{display:flex;justify-content:center;align-items:center;margin:27px auto 28px;max-width:390px}
.category{flex:1;display:flex;align-items:center;flex-direction:column;gap:8px;font-size:16px;font-weight:750}
.category+.category{border-left:1px solid #f4d86d}
.icon-wrap{width:68px;height:68px;border-radius:50%;background:#fff4bf;display:grid;place-items:center}
.category svg{width:37px;height:37px;stroke:var(--navy);stroke-width:2.3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.cta-wrap{padding:0 27px}
.cta{display:block;width:100%;border:0;border-radius:999px;padding:17px 20px 18px;background:linear-gradient(180deg,#ffdf37 0%,#ffd21c 54%,#f5bd00 100%);color:var(--navy);font-size:clamp(25px,6vw,32px);font-weight:850;letter-spacing:-.5px;box-shadow:0 8px 0 #dba900,0 12px 19px rgba(204,155,0,.23),inset 0 3px 5px rgba(255,255,255,.75);text-decoration:none;transition:transform .16s ease,box-shadow .16s ease;cursor:pointer}
.cta:active{transform:translateY(5px);box-shadow:0 3px 0 #dba900,0 6px 10px rgba(204,155,0,.2),inset 0 3px 5px rgba(255,255,255,.65)}
.terms{font-size:12px;line-height:1.7;color:#162c4d;margin:27px 24px 0}
.terms a{color:#1762a4;text-decoration:none}
@media(min-width:700px){body{background:#f2f5fa}.page{box-shadow:0 0 35px rgba(12,39,78,.08)}}
@media(max-height:740px){.hero{height:47svh;min-height:300px}.categories{margin:19px auto 22px}.terms{margin-top:22px}}
</style>
</head>
<body>
<main class="page">
  <section class="hero" aria-label="Rentspot rental illustration"></section>
  <div class="brand"><img src="assets/1000283253-removebg-preview.png" alt="Rentspot — Find, Rent, Live Better"></div>
  <section class="content">
    <h1>Find Your Perfect Space</h1>
    <p class="subtitle">Rent homes, offices and more — easily!</p>
    <div class="categories">
      <div class="category"><div class="icon-wrap"><svg viewBox="0 0 48 48"><path d="M6 22 24 7l18 15M11 19v22h26V19M20 41V27h8v14"/></svg></div><span>Homes</span></div>
      <div class="category"><div class="icon-wrap"><svg viewBox="0 0 48 48"><rect x="9" y="7" width="30" height="34" rx="2"/><path d="M16 14h4m8 0h4M16 22h4m8 0h4M16 30h4m8 0h4M21 41V35h6v6"/></svg></div><span>Offices</span></div>
      <div class="category"><div class="icon-wrap"><svg viewBox="0 0 48 48"><path d="M6 19h36l-3-10H9L6 19ZM9 19v22h30V19M6 19c0 5 8 5 8 0 0 5 8 5 8 0 0 5 8 5 8 0 0 5 8 5 8 0M18 41V28h12v13"/></svg></div><span>Shops</span></div>
    </div>
    <div class="cta-wrap"><a class="cta" href="coming-soon.html">Let’s Go</a></div>
    <p class="terms">By continuing, you agree to our <a href="#" onclick="return false">Terms and Conditions</a> and <a href="#" onclick="return false">Privacy Policy</a>.<br>By continuing, you agree to be contacted by us and our authorized representatives.</p>
  </section>
</main>
</body>
</html>
